[tools]
go = "1.26.3"
node = "24.22.2"
wrangler = "4.156.1"
jq = "1.8.1"
goreleaser = "2.19.0"

# Set CLOUDFLARE_ACCOUNT_ID in the gitignored mise.local.toml (or shell environment)
# when deploying with CLOUDFLARE_API_TOKEN instead of `wrangler login`.

[tasks.build-worker]
description = "Build the Cloudflare Workers bundle into build/"
run = """
go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go
GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o ./build/app.wasm ./cmd/mcp-worker
"""

[tasks.dev-vars]
description = "Write the gitignored .dev.vars for wrangler dev from the active fnox profile"
run = '''
set -eu
secrets="$(scripts/worker-secrets.sh dev-json)"
vars="$(printf %s "$secrets" | jq -r '
  to_entries[]
  | if .value | test("[\n'\'']") then error("\(.key) contains a newline or single quote")
    else "\(.key)='\''\(.value)'\''" end
')"
rm -f .dev.vars
umask 077
printf '%s\n' "$vars" > .dev.vars
'''

[tasks.dev]
description = "Run the worker locally with wrangler using secrets from the active fnox profile"
depends = ["dev-vars"]
run = "wrangler dev"

[tasks.deploy]
description = "Build and deploy the worker with the active fnox profile"
run = "fnox exec -- wrangler deploy"

[tasks.worker-secrets]
description = "Upload live secrets (fnox production profile, projects.json) to the production worker"
run = "scripts/worker-secrets.sh production"

[tasks.preview-secrets]
description = "Upload sandbox secrets (active fnox profile, projects.sandbox.json) to the Workers Previews base config"
run = "scripts/worker-secrets.sh preview"

[tasks.worker-projects]
description = "Upload projects.json to the worker as the REVENUECAT_PROJECTS secret"
run = "scripts/worker-secrets.sh projects"

[tasks.test]
description = "Run Go, Wasm, and npm wrapper tests"
run = [
  "go test -race ./...",
  "NODE_OPTIONS='--require=./testdata/workers_shim.cjs' GOOS=js GOARCH=wasm go test -exec=\"$(go env GOROOT)/lib/wasm/go_js_wasm_exec\" ./internal/httpclient",
  "node --test npm/wrapper.test.js",
]

[tasks."test:e2e"]
description = "Run gated live E2E tests against RevenueCat API v2 (skips when REVENUECAT_PROJECTS is unset)"
run = """
if [ -n "${REVENUECAT_PROJECTS:-}" ]; then
  exec go test -tags=e2e -race -v ./server -run TestLiveE2E
elif [ -n "${FNOX_AGE_KEY:-}" ] && [ -f fnox.cloud.toml ]; then
  exec fnox -c fnox.cloud.toml exec -- go test -tags=e2e -race -v ./server -run TestLiveE2E
else
  exec fnox exec -- go test -tags=e2e -race -v ./server -run TestLiveE2E
fi
"""

[tasks.lint]
description = "Vet the native, e2e, and wasm builds"
run = ["go vet ./...", "go vet -tags=e2e ./...", "GOOS=js GOARCH=wasm go vet ./..."]

[tasks.check]
description = "Check formatting and that the worker compiles to wasm"
run = """
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/mcp-worker
"""

[tasks.release-check]
description = "Validate the GoReleaser config and build a local snapshot into dist/"
run = ["goreleaser check", "goreleaser release --snapshot --clean"]
