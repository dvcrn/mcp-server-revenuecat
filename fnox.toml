[providers.1password]
type = "1password"

# Sandbox credentials for local dev and Workers Previews.
[secrets]
REVENUECAT_PROJECTS = { provider = "1password", value = "op://Dev/RevenueCat - mcp-server-revenuecat-org sandbox/credential" }
MCP_TOKEN = { provider = "1password", value = "op://Dev/mcp-server-revenuecat-org-preview/password" }

# Live credentials for the production worker.
[profiles.production.secrets]
REVENUECAT_PROJECTS = { provider = "1password", value = "op://Dev/RevenueCat - mcp-server-revenuecat-org/credential" }
MCP_TOKEN = { provider = "1password", value = "op://Dev/mcp-server-revenuecat-org-prod/password" }
# Optional: worker-secrets uploads it only when this item exists.
MCP_READ_TOKEN = { provider = "1password", value = "op://Dev/mcp-server-revenuecat-org-prod-readonly/password", if_missing = "ignore" }
